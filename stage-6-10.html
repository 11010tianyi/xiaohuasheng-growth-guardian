<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-10岁 小学生涯 | 小花生成长护航</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDF8F3;
            --warm-gold: #E8D4A8;
            --warm-coral: #F4A896;
            --soft-pink: #FFE4E1;
            --sage: #C5D5C0;
            --sage-dark: #9CB89C;
            --baby-blue: #E8F4F8;
            --lavender: #F0E6F5;
            --text-primary: #4A4A4A;
            --text-secondary: #7A7A7A;
            --white: #FFFFFF;
            --shadow-soft: 0 10px 40px rgba(0,0,0,0.05);
            --shadow-hover: 0 20px 60px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Noto Serif SC', sans-serif;
            background: var(--cream);
            color: var(--text-primary);
            line-height: 1.8;
            overflow-x: hidden;
        }

        .organic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.3; animation: float 20s infinite ease-in-out; }
        .blob-1 { width: 500px; height: 500px; background: linear-gradient(135deg, var(--warm-gold), var(--warm-coral)); top: -100px; right: -100px; }
        .blob-2 { width: 400px; height: 400px; background: linear-gradient(135deg, var(--baby-blue), var(--lavender)); bottom: -100px; left: -100px; animation-delay: -5s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.05); } }

        nav { position: fixed; top: 0; width: 100%; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: rgba(253, 248, 243, 0.9); backdrop-filter: blur(20px); }
        .logo { font-family: 'Noto Serif SC', serif; font-size: 1.5rem; font-weight: 700; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo::before { content: "🌱"; font-size: 1.8rem; }
        .back-btn { display: flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--white); border-radius: 50px; text-decoration: none; color: var(--text-secondary); font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow-soft); transition: all 0.3s ease; }
        .back-btn:hover { transform: translateX(-5px); box-shadow: var(--shadow-hover); color: var(--warm-coral); }

        .page-header { padding: 140px 60px 60px; text-align: center; max-width: 900px; margin: 0 auto; }
        .stage-badge { display: inline-block; padding: 8px 20px; background: linear-gradient(135deg, var(--warm-gold), var(--warm-coral)); color: var(--white); border-radius: 50px; font-size: 0.85rem; font-weight: 700; margin-bottom: 20px; }
        .page-header h1 { font-family: 'Noto Serif SC', serif; font-size: 3rem; margin-bottom: 20px; color: var(--text-primary); }
        .page-header p { font-size: 1.1rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto; }

        .progress-section { max-width: 600px; margin: 0 auto 30px; padding: 0 60px; }
        .progress-bar-container { background: rgba(0,0,0,0.06); border-radius: 20px; height: 12px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--warm-coral), var(--warm-gold)); border-radius: 20px; transition: width 0.5s ease; width: 0; }
        .progress-text { text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px; }

        .action-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .action-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border: none; border-radius: 50px; font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-soft); }
        .share-btn { background: var(--white); color: var(--text-secondary); }
        .share-btn:hover { background: var(--warm-gold); color: var(--white); transform: translateY(-2px); }
        .download-btn { background: linear-gradient(135deg, var(--warm-coral), var(--warm-gold)); color: var(--white); }
        .download-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

        .timeline-nav { display: flex; justify-content: center; gap: 20px; padding: 30px 60px; flex-wrap: wrap; }
        .timeline-btn { padding: 12px 28px; background: var(--white); border: 2px solid transparent; border-radius: 50px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-soft); }
        .timeline-btn:hover, .timeline-btn.active { border-color: var(--warm-coral); color: var(--warm-coral); transform: translateY(-2px); }
        .timeline-btn.active { background: linear-gradient(135deg, var(--warm-gold), var(--warm-coral)); color: var(--white); border-color: transparent; }

        .content-section { max-width: 1200px; margin: 0 auto; padding: 40px 60px 100px; }
        .phase-section { display: none; animation: fadeIn 0.5s ease; }
        .phase-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .phase-header { text-align: center; margin-bottom: 50px; }
        .phase-header h2 { font-family: 'Noto Serif SC', serif; font-size: 2rem; margin-bottom: 10px; }
        .phase-header p { color: var(--text-secondary); }

        .milestones-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
        .milestone-card { background: var(--white); border-radius: 24px; padding: 30px; box-shadow: var(--shadow-soft); transition: all 0.4s ease; position: relative; overflow: hidden; }
        .milestone-card::before { content: ''; position: absolute; left: 0; top: 0; width: 5px; height: 100%; background: linear-gradient(180deg, var(--warm-coral), var(--warm-gold)); transform: scaleY(0); transform-origin: bottom; transition: transform 0.4s ease; }
        .milestone-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
        .milestone-card:hover::before { transform: scaleY(1); }

        .milestone-category { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 15px; }
        .category-health { background: #FFE4E1; color: #D47373; }
        .category-vaccine { background: #E8F4E8; color: #5A9A5A; }
        .category-earlyedu { background: #FFF8DC; color: #B8A050; }
        .category-emotion { background: #F0E6F5; color: #8B6F8B; }
        .category-record { background: #E8F4F8; color: #5A8A9A; }
        .category-food { background: #FFF0F5; color: #A06080; }

        .milestone-title { font-family: 'Noto Serif SC', serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: var(--text-primary); }
        .milestone-desc { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .milestone-meta { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.05); gap: 10px; flex-wrap: wrap; }
        .milestone-time { font-size: 0.85rem; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
        .milestone-note { font-size: 0.8rem; color: var(--warm-coral); font-weight: 600; }

        .milestone-check { width: 28px; height: 28px; border: 2px solid var(--sage); border-radius: 50%; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .milestone-check:hover { background: var(--sage); }
        .milestone-check.checked { background: var(--sage-dark); border-color: var(--sage-dark); }
        .milestone-check.checked::after { content: "✓"; color: white; font-size: 14px; font-weight: bold; }

        .stats-bar { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: var(--white); padding: 25px 40px; border-radius: 20px; text-align: center; box-shadow: var(--shadow-soft); min-width: 150px; }
        .stat-card-number { font-size: 2.5rem; font-weight: 700; color: var(--warm-coral); line-height: 1; }
        .stat-card-label { font-size: 0.9rem; color: var(--text-secondary); margin-top: 8px; }

        .tip-box { background: linear-gradient(135deg, var(--warm-gold), var(--soft-pink)); border-radius: 20px; padding: 30px; margin-bottom: 40px; color: var(--text-primary); }
        .tip-box h3 { font-family: 'Noto Serif SC', serif; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .tip-box p { font-size: 0.95rem; opacity: 0.9; }

        footer { padding: 40px; text-align: center; color: var(--text-secondary); background: var(--white); margin-top: 60px; }

        @media (max-width: 768px) {
            nav { padding: 15px 30px; }
            .page-header { padding: 120px 30px 40px; }
            .page-header h1 { font-size: 2rem; }
            .timeline-nav { padding: 20px 30px; }
            .content-section { padding: 20px 30px 60px; }
            .milestones-grid { grid-template-columns: 1fr; }
            .progress-section { padding: 0 30px; }
        }
    </style>
</head>
<body>
    <div class="organic-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav>
        <a href="index.html" class="logo">小花生成长护航</a>
        <a href="index.html" class="back-btn">← 返回首页</a>
    </nav>

    <header class="page-header">
        <div class="stage-badge">📚 第三阶段</div>
        <h1>6-10岁 小学生涯</h1>
        <p>成为小学生，学习习惯养成，独立性培养，迎接青春期。从懵懂孩童到独立少年的成长之路。</p>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-card-number">73</div>
            <div class="stat-card-label">个里程碑</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-number">4</div>
            <div class="stat-card-label">个年级</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-number">4</div>
            <div class="stat-card-label">次体检</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-number">5</div>
            <div class="stat-card-label">个仪式</div>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text">0/73 已完成</div>
    </div>

    <div class="action-bar">
        <button class="action-btn share-btn" onclick="shareProgress()">🔗 分享进度</button>
        <button class="action-btn download-btn" onclick="generateExcel()">📥 下载 Excel</button>
    </div>

    <div class="timeline-nav">
        <button class="timeline-btn active" data-phase="6-7">📚 6-7岁<br><small>一年级</small></button>
        <button class="timeline-btn" data-phase="7-8">✨ 7-8岁<br><small>二年级</small></button>
        <button class="timeline-btn" data-phase="8-9">🚀 8-9岁<br><small>三年级</small></button>
        <button class="timeline-btn" data-phase="9-10">🌈 9-10岁<br><small>高年级</small></button>
    </div>

    <section class="content-section">
        <div id="milestone-container"></div>
    </section>

    <footer>
        <p>Made with ❤️ for 小花生 | 在她每个需要我的节点都不错过</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script src="milestones-data.js"></script>
    <script src="growth-guardian.js"></script>
    <script>
        initGrowthGuardian();
        renderMilestones(document.getElementById('milestone-container'), { phases: ['6-7', '7-8', '8-9', '9-10'] });
        initTimeline();
    </script>
</body>
</html>
